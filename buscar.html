<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11110f">
<meta name="description" content="Busque perfumes e decants no catálogo SANTINO.">
<title>SANTINO | Buscar fragrâncias</title>
<style>
:root{--black:#11110f;--panel:#1a1916;--cream:#f3eadb;--beige:#c9b18b;--muted:#b9b0a2;--line:#39352f}
*{box-sizing:border-box}
body{margin:0;background:var(--black);color:var(--cream);font-family:Arial,Helvetica,sans-serif}
a{color:inherit}
button,input{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:rgba(17,17,15,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.nav{max-width:1120px;margin:auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{font-family:Georgia,serif;letter-spacing:.18em;font-size:15px;color:var(--cream);text-transform:uppercase;text-decoration:none}
.brand small{display:block;font-family:Arial,sans-serif;letter-spacing:.24em;font-size:9px;color:var(--beige);margin-top:5px}
.nav-links{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.nav-links a{color:var(--muted);font-size:13px;text-decoration:none}
.nav-links a:hover{color:var(--beige)}
main{max-width:1120px;margin:auto;padding:34px 22px 60px}
.eyebrow{color:var(--beige);letter-spacing:.16em;text-transform:uppercase;font-size:11px;font-weight:bold}
h1{font-family:Georgia,serif;font-size:clamp(32px,5vw,48px);font-weight:400;line-height:1.08;margin:10px 0}
.intro{color:var(--muted);line-height:1.6;max-width:680px}
.site-search{margin:22px 0 28px;max-width:650px;width:100%}
.site-search label{display:block;color:var(--beige);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.site-search-row{display:flex;gap:8px;margin-top:7px;width:100%}
.site-search input{flex:1;min-width:0;padding:13px 14px;min-height:48px;border:1px solid var(--line);border-radius:3px;background:#171613;color:var(--cream);outline:none}
.site-search input:focus{border-color:var(--beige);box-shadow:0 0 0 2px #c9b18b22}
.site-search input::placeholder{color:#888174}
.btn{display:inline-flex;justify-content:center;align-items:center;padding:12px 17px;min-height:48px;border:1px solid var(--beige);border-radius:3px;background:var(--beige);color:#171512;font-weight:700;text-decoration:none}
.btn:disabled{opacity:.7;cursor:wait}
.page-search{margin:22px 0 26px;max-width:680px}
.page-search label{display:block;color:var(--beige);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:7px}
.page-search-row{display:flex;gap:8px}
.page-search input{flex:1;min-width:0;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:3px;background:#171613;color:var(--cream)}
.page-search input:focus{outline:1px solid var(--beige);border-color:var(--beige)}
.page-search .btn{font-size:12px}
.results-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:28px 0 14px}
h2{font-family:Georgia,serif;font-size:27px;font-weight:400;margin:0}
.result-count{color:var(--muted);font-size:12px}
.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.result-card{border:1px solid var(--line);background:linear-gradient(145deg,#201e19,#171613);padding:17px;display:flex;flex-direction:column;min-height:170px}
.result-type{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--beige)}
.result-card h3{font-family:Georgia,serif;font-weight:400;font-size:21px;margin:10px 0 4px}
.result-brand{font-size:12px;color:var(--muted)}
.result-card .btn{margin-top:auto;align-self:flex-start;font-size:12px;padding:9px 12px;min-height:40px}
.empty-state{border:1px solid var(--line);padding:20px;color:var(--muted);line-height:1.6;background:#171613}
.empty-state strong{color:var(--cream)}
footer{border-top:1px solid var(--line);padding:24px 15px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
@media(max-width:720px){
 .nav{padding:12px 15px;align-items:flex-start;gap:10px;flex-direction:column}
 .nav-links{gap:14px}
 main{padding:26px 15px 44px}
 .site-search{margin:18px 0 24px}.page-search{margin:18px 0 24px}.page-search-row{gap:6px}.page-search input{font-size:14px;padding:11px}.page-search .btn{padding:10px 13px}
 .site-search-row{gap:6px}
 .site-search input{font-size:14px;padding:11px}
 .site-search .btn{padding:10px 13px}
 .results{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .result-card{padding:12px;min-height:164px}
 .result-card h3{font-size:18px}
 .results-head{align-items:flex-start;flex-direction:column;gap:5px}
}
@media(max-width:360px){.results{grid-template-columns:1fr}}

/* Redesign SANTINO — layout premium responsivo */
.nav{gap:14px!important}
.nav-search{display:flex;align-items:center;min-width:0;flex:0 1 225px;height:39px;border:1px solid #3c362f;border-radius:30px;background:#181715;margin-left:auto}
.nav-search input{min-width:0;width:100%;height:100%;background:transparent;border:0;outline:0;color:#f3eadb;font-size:12px;padding:0 0 0 13px}
.nav-search button{height:100%;min-width:39px;background:transparent;border:0;color:#c9b18b;font-size:24px;cursor:pointer}
.nav-search input::placeholder{color:#938a7e}
@media(max-width:720px){.nav-search{order:2;flex:1 1 125px;margin-left:auto;max-width:190px}.nav-search input{font-size:11px;padding-left:10px}.nav-search button{min-width:31px}.catalog-nav{order:3;width:100%;margin-left:0!important}}

/* Cabeçalho SANTINO consistente entre as páginas */
.nav{display:grid!important;grid-template-columns:minmax(145px,1fr) minmax(180px,250px) auto;align-items:center!important;gap:16px!important}
.nav-links{display:flex;align-items:center;gap:16px}
.nav-links a{color:var(--muted);font-size:12px;text-decoration:none}
.nav-links a:hover{color:var(--beige)}
@media(max-width:720px){
 .nav{display:grid!important;grid-template-columns:minmax(112px,1fr) minmax(108px,150px)!important;gap:8px!important;padding:13px 13px 10px!important;align-items:center!important}
 .nav .brand{font-size:17px;letter-spacing:.13em}
 .nav .brand small{font-size:7px;letter-spacing:.15em;margin-top:5px}
 .nav-search{grid-column:2;grid-row:1;width:100%;min-width:0;max-width:none!important;height:36px!important;margin:0!important}
 .nav-search input{font-size:11px!important;padding-left:9px!important}
 .nav-search button{width:29px!important;min-width:29px!important;font-size:18px!important}
 .nav-links{grid-column:1/-1;grid-row:2;gap:17px!important}
 .nav-links a{font-size:12px}
}

/* Ícone de busca discreto, sem glifo de fonte */
.nav-search button{position:relative;font-size:0!important}
.nav-search button:before{content:"";position:absolute;left:calc(50% - 7px);top:calc(50% - 7px);width:12px;height:12px;border:1.6px solid var(--beige,#c9b18b);border-radius:50%}
.nav-search button:after{content:"";position:absolute;left:calc(50% + 4px);top:calc(50% + 4px);width:6px;height:1.6px;border-radius:2px;background:var(--beige,#c9b18b);transform:rotate(45deg);transform-origin:left center}

.nav-links a[href="kits.html"]{color:var(--beige);font-weight:700}
.nav-links a{font-size:13px!important}
@media(max-width:720px){.nav-links{gap:14px!important;flex-wrap:wrap}.nav-links a{font-size:12px!important}}
</style>
  <link rel="stylesheet" href="santino-ui.css">
</head>
<body>
<header>
  <div class="nav">
    <a class="brand" href="index.html">SANTINO<small>DECANTS &amp; FRAGRÂNCIAS</small></a>
    <form class="nav-search" action="buscar.html" method="get" data-santino-search><input type="search" name="q" maxlength="100" placeholder="Buscar perfumes..." aria-label="Buscar perfumes" required><button type="submit" aria-label="Pesquisar">⌕</button></form><nav class="nav-links" aria-label="Navegação">
      <a href="index.html">Início</a><a href="decants.html">Decants</a><a href="frascos.html">Frascos inteiros</a><a href="kits.html">Kits</a>
    </nav>
  </div>
</header>
<main>
  <div class="eyebrow">Catálogo SANTINO</div>
  <h1>Encontre sua fragrância.</h1>
  <p class="intro">Pesquise pelo nome do perfume ou pela marca. A busca considera decants e frascos inteiros.</p>
  <form class="page-search" action="buscar.html" method="get" data-santino-search>
    <label for="siteSearchInput">Pesquisar fragrância</label>
    <div class="page-search-row"><input id="siteSearchInput" type="search" name="q" maxlength="100" placeholder="Ex.: Asad Bourbon, Sauvage, Azzaro..." autocomplete="off" required><button class="btn" type="submit">Pesquisar</button></div>
  </form>
  <section aria-labelledby="resultsTitle">
    <div class="results-head">
      <h2 id="resultsTitle">Resultados da busca</h2>
      <span class="result-count" id="resultCount" aria-live="polite"></span>
    </div>
    <div class="results" id="searchResults" aria-live="polite"></div>
  </section>
</main>
<footer>
  <div>SANTINO · DECANTS &amp; FRAGRÂNCIAS</div>
</footer>
<script>
(function(){
  const products = [
    {id:"kingdom",name:"The Kingdom",brand:"Lattafa",category:"Decant",terms:"kingdom the kingdom lattafa"},
    {id:"212-vip-black",name:"212 VIP Black",brand:"Carolina Herrera",category:"Decant",terms:"212 vip black carolina herrera"},
    {id:"the-blend-bourbon",name:"The Blend Bourbon",brand:"O Boticário",category:"Decant",terms:"the blend bourbon boticario"},
    {id:"asad-bourbon",name:"Asad Bourbon",brand:"Lattafa",category:"Decant",terms:"asad assad bourbon lattafa"},
    {id:"homem-sagaz",name:"Homem Sagaz",brand:"Natura",category:"Decant",terms:"homem sagaz natura"},
    {id:"homem-dom",name:"Homem Dom",brand:"Natura",category:"Decant",terms:"homem dom natura"},
    {id:"homem-essence",name:"Homem Essence",brand:"Natura",category:"Decant",terms:"homem essence natura"},
    {id:"essencial-sentir",name:"Essencial Sentir",brand:"Natura",category:"Decant",terms:"essencial sentir natura"},
    {id:"fakhar-black",name:"Fakhar Black",brand:"Lattafa",category:"Decant",terms:"fakhar black lattafa"},
    {id:"k-max",name:"K Max",brand:"Natura Kaiak",category:"Decant",terms:"k max kaiak natura"},
    {id:"full-kingdom",name:"The Kingdom",brand:"Lattafa",category:"Frasco inteiro",terms:"kingdom lattafa"},
    {id:"full-212-vip-black",name:"212 VIP Black",brand:"Carolina Herrera",category:"Frasco inteiro",terms:"212 vip black carolina herrera"},
    {id:"full-the-blend-bourbon",name:"The Blend Bourbon",brand:"O Boticário",category:"Frasco inteiro",terms:"the blend bourbon boticario"},
    {id:"full-homem-sagaz",name:"Homem Sagaz",brand:"Natura",category:"Frasco inteiro",terms:"homem sagaz natura"},
    {id:"full-homem-dom",name:"Homem Dom",brand:"Natura",category:"Frasco inteiro",terms:"homem dom natura"},
    {id:"full-homem-essence",name:"Homem Essence",brand:"Natura",category:"Frasco inteiro",terms:"homem essence natura"},
    {id:"full-essencial-sentir",name:"Essencial Sentir",brand:"Natura",category:"Frasco inteiro",terms:"essencial sentir natura"},
    {id:"full-fakhar-black",name:"Fakhar Black",brand:"Lattafa",category:"Frasco inteiro",terms:"fakhar black lattafa"},
    {id:"full-k-max",name:"K Max",brand:"Natura Kaiak",category:"Frasco inteiro",terms:"k max kaiak natura"},
    {id:"full-le-male",name:"Le Male Le Parfum",brand:"Jean Paul Gaultier",category:"Frasco inteiro",terms:"le male le parfum jean paul gaultier jpg"},
    {id:"full-afnan-9pm",name:"9PM",brand:"Afnan",category:"Frasco inteiro",terms:"9pm afnan"},
    {id:"full-asad-bourbon",name:"Asad Bourbon",brand:"Lattafa",category:"Frasco inteiro",terms:"asad bourbon lattafa"},
    {id:"full-asad",name:"Asad tradicional",brand:"Lattafa",category:"Frasco inteiro",terms:"asad assad tradicional lattafa"},
    {id:"full-eros",name:"Eros",brand:"Versace",category:"Frasco inteiro",terms:"eros versace"},
    {id:"full-million",name:"1 Million",brand:"Rabanne",category:"Frasco inteiro",terms:"1 million one million rabanne paco rabanne"},
    {id:"full-sauvage",name:"Sauvage",brand:"Dior",category:"Frasco inteiro",terms:"sauvage dior"},
    {id:"full-invictus",name:"Invictus",brand:"Rabanne",category:"Frasco inteiro",terms:"invictus rabanne paco rabanne"},
    {id:"full-myslf",name:"MYSLF",brand:"Yves Saint Laurent",category:"Frasco inteiro",terms:"myslf yves saint laurent ysl"}
  ];

  function normalize(value){
    return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  }
  function escapeHTML(value){
    return String(value).replace(/[&<>"']/g,function(char){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char];
    });
  }

  const params = new URLSearchParams(window.location.search);
  const query = String(params.get("q") || "").replace(/\s+/g," ").trim().slice(0,100);
  const input = document.getElementById("siteSearchInput");
  const results = document.getElementById("searchResults");
  const count = document.getElementById("resultCount");
  const title = document.getElementById("resultsTitle");
  if (input) input.value = query;

  if (!query) {
    title.textContent = "Catálogo disponível";
    count.textContent = products.length + " fragrâncias";
    results.innerHTML = '<div class="empty-state" style="grid-column:1/-1">Digite um nome ou uma marca para encontrar fragrâncias no catálogo.</div>';
    return;
  }

  const tokens = normalize(query).split(/\s+/).filter(Boolean);
  const matches = products.filter(function(product){
    const searchable = normalize(product.name + " " + product.brand + " " + product.category + " " + product.terms);
    return tokens.every(function(token){return searchable.includes(token);});
  });

  title.textContent = 'Resultados para “' + query + '”';
  count.textContent = matches.length + (matches.length === 1 ? " resultado" : " resultados");

  if (!matches.length) {
    results.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><strong>Nenhuma fragrância encontrada.</strong><br>Confira a escrita ou tente pesquisar apenas parte do nome ou a marca.</div>';
    return;
  }

  results.innerHTML = matches.map(function(product){
    return '<article class="result-card">' +
      '<div class="result-type">' + escapeHTML(product.category) + '</div>' +
      '<h3>' + escapeHTML(product.name) + '</h3>' +
      '<div class="result-brand">' + escapeHTML(product.brand) + '</div>' +
      '<a class="btn" href="produto.html?id=' + encodeURIComponent(product.id) + '">Ver fragrância</a>' +
    '</article>';
  }).join("");
})();
</script>
<script src="search.js" defer></script>
  <script src="santino-ui.js" defer></script>
</body>
</html>
