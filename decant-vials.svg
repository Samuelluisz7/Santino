<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-labelledby="title desc">
<title id="title">Mini frascos de decant SANTINO</title>
<desc id="desc">Dois pequenos frascos vaporizadores transparentes, de cinco e dez mililitros.</desc>
<defs>
  <linearGradient id="glass" x1="0" x2="1">
    <stop offset="0" stop-color="#17191a" stop-opacity=".78"/>
    <stop offset=".22" stop-color="#a9a49a" stop-opacity=".38"/>
    <stop offset=".48" stop-color="#292c2c" stop-opacity=".88"/>
    <stop offset=".78" stop-color="#d8d0c3" stop-opacity=".24"/>
    <stop offset="1" stop-color="#151718" stop-opacity=".92"/>
  </linearGradient>
  <linearGradient id="liquid" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#c6a36d" stop-opacity=".52"/>
    <stop offset="1" stop-color="#8f6333" stop-opacity=".95"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" x2="1">
    <stop offset="0" stop-color="#59452b"/>
    <stop offset=".35" stop-color="#e0c18c"/>
    <stop offset=".65" stop-color="#927447"/>
    <stop offset="1" stop-color="#4f3e28"/>
  </linearGradient>
  <linearGradient id="cap" x1="0" x2="1">
    <stop offset="0" stop-color="#111"/>
    <stop offset=".5" stop-color="#45413a"/>
    <stop offset="1" stop-color="#0b0b0b"/>
  </linearGradient>
  <filter id="shadow" x="-50%" y="-30%" width="200%" height="180%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>
<ellipse cx="113" cy="237" rx="85" ry="11" fill="#000" opacity=".42" filter="url(#shadow)"/>
<!-- 10 ml -->
<g transform="translate(24 10)">
  <rect x="40" y="47" width="57" height="21" rx="4" fill="url(#cap)" stroke="#82765f" stroke-width="1.5"/>
  <rect x="49" y="37" width="39" height="11" rx="3" fill="#181818" stroke="#a38c64" stroke-width="1.2"/>
  <rect x="59" y="27" width="19" height="11" rx="2" fill="url(#metal)"/>
  <rect x="35" y="66" width="67" height="146" rx="12" fill="url(#glass)" stroke="#d3c5a9" stroke-width="2"/>
  <path d="M39 145 Q68 138 98 145 V199 Q98 207 89 207 H47 Q39 207 39 198Z" fill="url(#liquid)" opacity=".86"/>
  <path d="M43 84 Q47 75 52 78 V185 Q48 192 43 179Z" fill="#fff" opacity=".28"/>
  <path d="M92 82 Q98 91 95 120" fill="none" stroke="#f5ead7" stroke-opacity=".44" stroke-width="2"/>
  <rect x="42" y="111" width="53" height="49" rx="3" fill="#171614" fill-opacity=".9" stroke="#b89a68" stroke-width="1"/>
  <text x="68.5" y="132" fill="#e5d5b7" text-anchor="middle" font-family="Georgia,serif" font-size="9" letter-spacing="1">SANTINO</text>
  <text x="68.5" y="146" fill="#c7b18b" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" letter-spacing="1.2">10 ML</text>
</g>
<!-- 5 ml -->
<g transform="translate(126 73) scale(.78)">
  <rect x="40" y="47" width="57" height="21" rx="4" fill="url(#cap)" stroke="#82765f" stroke-width="1.5"/>
  <rect x="49" y="37" width="39" height="11" rx="3" fill="#181818" stroke="#a38c64" stroke-width="1.2"/>
  <rect x="59" y="27" width="19" height="11" rx="2" fill="url(#metal)"/>
  <rect x="35" y="66" width="67" height="146" rx="12" fill="url(#glass)" stroke="#e0d2b8" stroke-width="2"/>
  <path d="M39 145 Q68 138 98 145 V199 Q98 207 89 207 H47 Q39 207 39 198Z" fill="url(#liquid)" opacity=".86"/>
  <path d="M43 84 Q47 75 52 78 V185 Q48 192 43 179Z" fill="#fff" opacity=".28"/>
  <path d="M92 82 Q98 91 95 120" fill="none" stroke="#f5ead7" stroke-opacity=".44" stroke-width="2"/>
  <rect x="42" y="111" width="53" height="49" rx="3" fill="#171614" fill-opacity=".9" stroke="#b89a68" stroke-width="1"/>
  <text x="68.5" y="132" fill="#e5d5b7" text-anchor="middle" font-family="Georgia,serif" font-size="9" letter-spacing="1">SANTINO</text>
  <text x="68.5" y="146" fill="#c7b18b" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" letter-spacing="1.2">5 ML</text>
</g>
</svg>